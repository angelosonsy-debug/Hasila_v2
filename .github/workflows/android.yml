# -----------------------------------------------------------------------
# حصيلتي — CI / Release
#
# Job 1 (ci):  every push to main and every PR.
#   install (npm ci, lockfile-enforced) → test → build → debug APK.
#   Artifact: downloadable debug APK for device testing.
#
# Job 2 (release):  only on git tags matching v* (e.g. v1.2.3).
#   Requires Job 1 to pass first, then adds release signing.
#   Artifact: signed AAB ready for Google Play.
#
#   Required GitHub Secrets (Settings → Secrets → Actions):
#     KEYSTORE_BASE64    – base64-encoded .jks upload keystore
#     KEYSTORE_PASSWORD  – keystore store password
#     KEY_ALIAS          – key alias inside the .jks
#     KEY_PASSWORD       – key password
#
# Node pinned to 24 LTS (Active LTS, supported until April 2028).
# Node 20 reached EOL in April 2025 and is no longer used here.
#
# Security note: npm audit reports 4 findings (critical/high in tar and
# vite, both dev-build-time only, not in the shipped APK).
# See SECURITY.md for full analysis. Fix requires Capacitor 8 + Vite 8
# migration (tracked as Phase C).
# -----------------------------------------------------------------------

name: CI / Release

on:
  push:
    branches: [main]
    tags:     ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:

  # -----------------------------------------------------------------
  # CI: install → test → build → debug APK
  # -----------------------------------------------------------------
  ci:
    name: CI (test + debug build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean install (npm ci — reproducible from lockfile)
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build
        env:
          # Debug APKs use Google's test ad unit so live ads are never clicked in testing
          VITE_ADMOB_TESTING: "true"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Add Android platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          npm install sharp
          node scripts/generate-icons.mjs

      - name: Patch AndroidManifest — AdMob App ID
        run: |
          python3 - << 'PYEOF'
          import sys
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if "APPLICATION_ID" in content:
              print("AdMob meta-data already present — skipping")
              sys.exit(0)
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1668741011095023~9376063574"/>'
          # Insert before the first <activity tag — safely inside <application>
          # after all its attributes have closed, never mid-tag.
          if "<activity" not in content:
              print("ERROR: could not find <activity> in manifest", file=sys.stderr)
              sys.exit(1)
          content = content.replace("<activity", meta + "\n\n        <activity", 1)
          with open(path, "w") as f:
              f.write(content)
          print("AdMob meta-data injected successfully")
          PYEOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set versionCode and versionName (CI)
        run: |
          VERSION_CODE=$(( $(date +%s) / 10 ))
          VERSION_NAME="1.0.$(date +%Y-%m-%d)"
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "versionCode=$VERSION_CODE  versionName=$VERSION_NAME"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hasila-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # -----------------------------------------------------------------
  # Release: signed AAB for Google Play (v* tags only)
  # -----------------------------------------------------------------
  release:
    name: Release (signed AAB)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Add Android platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          npm install sharp
          node scripts/generate-icons.mjs

      - name: Patch AndroidManifest — AdMob App ID
        run: |
          python3 - << 'PYEOF'
          import sys
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if "APPLICATION_ID" in content:
              print("AdMob meta-data already present — skipping")
              sys.exit(0)
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1668741011095023~9376063574"/>'
          if "<activity" not in content:
              print("ERROR: could not find <activity> in manifest", file=sys.stderr)
              sys.exit(1)
          content = content.replace("<activity", meta + "\n\n        <activity", 1)
          with open(path, "w") as f:
              f.write(content)
          print("AdMob meta-data injected successfully")
          PYEOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set versionCode and versionName from tag
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          VERSION_CODE=$(( $(date +%s) / 10 ))
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$TAG\"/" android/app/build.gradle
          echo "versionCode=$VERSION_CODE  versionName=$TAG"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build release AAB (signed)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: hasila-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
